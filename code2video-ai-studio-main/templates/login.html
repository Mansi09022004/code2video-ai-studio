<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Code2Video AI Studio</title>
  <meta name="description" content="Sign in to Code2Video AI Studio to turn Python code into narrated explainer videos.">
  <meta name="theme-color" content="#060a14">
  <meta property="og:title" content="Code2Video AI Studio">
  <meta property="og:description" content="Turn Python code into narrated, step-by-step explainer videos with AI.">
  <meta property="og:image" content="{{ request.url_root }}static/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/static/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>

<main class="auth-wrap">
  <div class="auth-card">
    <a href="/" class="brand" aria-label="Code2Video home">
      <span class="brand-mark"><i class="fas fa-play"></i></span>
      <span>Code<b>2</b>Video</span>
    </a>

    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to continue to your studio.</p>

    <div class="tabs" role="tablist" aria-label="Sign in or create account">
      <button class="tab" role="tab" id="tabLogin" aria-selected="true" aria-controls="loginForm">Sign in</button>
      <button class="tab" role="tab" id="tabRegister" aria-selected="false" aria-controls="registerForm">Create account</button>
    </div>

    {% if error %}
    <div class="form-alert error show" role="alert"><i class="fas fa-circle-exclamation"></i><span>{{ error }}</span></div>
    {% endif %}

    <a href="/auth/google" class="btn btn-google btn-block">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </a>

    <div class="divider">or use email</div>

    <!-- Sign in -->
    <form id="loginForm" role="tabpanel" aria-labelledby="tabLogin" novalidate>
      <div class="form-alert error" id="loginAlert" role="alert"><i class="fas fa-circle-exclamation"></i><span></span></div>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input class="input" id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        <div class="field-error" id="loginEmailErr"></div>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="pw-wrap">
          <input class="input" id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" class="pw-toggle" data-target="loginPassword" aria-label="Show password"><i class="far fa-eye"></i></button>
        </div>
        <div class="field-error" id="loginPasswordErr"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign in</button>
    </form>

    <!-- Create account -->
    <form id="registerForm" role="tabpanel" aria-labelledby="tabRegister" hidden novalidate>
      <div class="form-alert error" id="registerAlert" role="alert"><i class="fas fa-circle-exclamation"></i><span></span></div>
      <div class="form-alert success" id="registerSuccess" role="status"><i class="fas fa-circle-check"></i><span></span></div>
      <div class="field">
        <label for="regName">Full name</label>
        <input class="input" id="regName" type="text" autocomplete="name" placeholder="Your name" required>
        <div class="field-error" id="regNameErr"></div>
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input class="input" id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        <div class="field-error" id="regEmailErr"></div>
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <div class="pw-wrap">
          <input class="input" id="regPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
          <button type="button" class="pw-toggle" data-target="regPassword" aria-label="Show password"><i class="far fa-eye"></i></button>
        </div>
        <div class="field-error" id="regPasswordErr"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">Create account</button>
    </form>

    <p class="auth-foot"><a href="/"><i class="fas fa-arrow-left"></i> Back to home</a></p>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const tabs = { login: $("tabLogin"), register: $("tabRegister") };
  const forms = { login: $("loginForm"), register: $("registerForm") };
  const copy = {
    login: ["Welcome back", "Sign in to continue to your studio."],
    register: ["Create your account", "Start turning code into videos — it's free."]
  };

  function setMode(mode) {
    Object.keys(forms).forEach((k) => {
      const on = k === mode;
      forms[k].hidden = !on;
      tabs[k].setAttribute("aria-selected", String(on));
    });
    $("authTitle").textContent = copy[mode][0];
    $("authSub").textContent = copy[mode][1];
    clearErrors();
    history.replaceState(null, "", mode === "register" ? "/login?mode=register" : "/login");
  }
  tabs.login.addEventListener("click", () => setMode("login"));
  tabs.register.addEventListener("click", () => setMode("register"));

  function clearErrors() {
    document.querySelectorAll(".field-error").forEach((e) => (e.textContent = ""));
    document.querySelectorAll(".input").forEach((i) => i.removeAttribute("aria-invalid"));
    document.querySelectorAll("form .form-alert").forEach((a) => a.classList.remove("show"));
  }
  function fieldError(inputId, msg) {
    $(inputId + "Err").textContent = msg;
    $(inputId).setAttribute("aria-invalid", "true");
  }
  function alertMsg(id, msg) {
    const el = $(id);
    el.querySelector("span").textContent = msg;
    el.classList.add("show");
  }
  function busy(btn, on, label) {
    btn.disabled = on;
    btn.innerHTML = on ? '<span class="spinner"></span> Please wait…' : label;
  }
  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

  async function post(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    return { ok: res.ok && data.status === "success", data };
  }

  document.querySelectorAll(".pw-toggle").forEach((b) => {
    b.addEventListener("click", () => {
      const inp = $(b.dataset.target);
      const show = inp.type === "password";
      inp.type = show ? "text" : "password";
      b.innerHTML = show ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
      b.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  });

  forms.login.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;
    let bad = false;
    if (!validEmail(email)) { fieldError("loginEmail", "Enter a valid email address."); bad = true; }
    if (!password) { fieldError("loginPassword", "Enter your password."); bad = true; }
    if (bad) return;
    const btn = $("loginBtn");
    busy(btn, true);
    try {
      const { ok, data } = await post("/api/login", { email, password });
      if (ok) { window.location.href = "/dashboard"; return; }
      alertMsg("loginAlert", data.message || "Incorrect email or password.");
    } catch (_) {
      alertMsg("loginAlert", "Couldn't reach the server. Check your connection and try again.");
    }
    busy(btn, false, "Sign in");
  });

  forms.register.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();
    const name = $("regName").value.trim();
    const email = $("regEmail").value.trim();
    const password = $("regPassword").value;
    let bad = false;
    if (!name) { fieldError("regName", "Enter your name."); bad = true; }
    if (!validEmail(email)) { fieldError("regEmail", "Enter a valid email address."); bad = true; }
    if (password.length < 6) { fieldError("regPassword", "Use at least 6 characters."); bad = true; }
    if (bad) return;
    const btn = $("registerBtn");
    busy(btn, true);
    try {
      const { ok, data } = await post("/api/register", { name, email, password });
      if (ok) {
        alertMsg("registerSuccess", "Account created. Taking you to your studio…");
        setTimeout(() => (window.location.href = "/dashboard"), 700);
        return;
      }
      alertMsg("registerAlert", data.message === "User already exists"
        ? "An account with this email already exists. Try signing in instead."
        : (data.message || "Couldn't create your account. Please try again."));
    } catch (_) {
      alertMsg("registerAlert", "Couldn't reach the server. Check your connection and try again.");
    }
    busy(btn, false, "Create account");
  });

  setMode(new URLSearchParams(location.search).get("mode") === "register" ? "register" : "login");
})();
</script>
</body>
</html>
